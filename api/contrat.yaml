openapi: 3.0.3
info:
  title: Contrat imposé — Épreuve finale KFOKAM48
  version: "1.0"
  description: |
    Les cinq opérations décrites ici doivent exister EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Tout le reste de ton API est libre — ajoute tes propres opérations
    dans ce même fichier, sous /api, avant ton premier commit de code.

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }   # sessions: promotion inconnue / titre absent

    get:
      summary: Sessions d'une promotion (écran formateur)
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [id, titre, promotionId, code, statut, ouvertureAt, expirationAt, clotureAt]
                  properties:
                    id: { type: integer, format: int64 }
                    titre: { type: string }
                    promotionId: { type: integer, format: int64 }
                    code: { type: string }
                    statut: { type: string, enum: [OUVERTE, CLOTUREE] }
                    ouvertureAt: { type: string, format: date-time }
                    expirationAt: { type: string, format: date-time }
                    clotureAt: { type: string, format: date-time, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
                source:
                  type: string
                  enum: [ETUDIANT, FORMATEUR]
                  default: ETUDIANT
                  description: |
                    AJOUT DU CANDIDAT — facultatif, défaut ETUDIANT.
                    Q14 : le formateur peut relever la présence d'un étudiant.
                    Chemin, verbe, codes de statut et format d'erreur sont
                    inchangés ; seule une propriété facultative est ajoutée
                    au corps, et la valeur renvoyée `source` correspond (B2).
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    # Propriété FACULTATIVE ajoutée par le candidat (RG13 / Q14) :
                    # elle rend distinguables les présences relevées par le formateur.
                    # Les six champs imposés ci-dessus sont inchangés, mêmes noms et mêmes types.
                    presencesFormateur: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ===========================================================================
  # OPÉRATIONS AJOUTÉES PAR LE CANDIDAT
  # Les 5 opérations ci-dessus sont imposées et n'ont pas été modifiées dans
  # leurs chemins, verbes, codes de statut ni format d'erreur.
  # Celles-ci répondent aux trous relevés dans le cahier des charges §7.2 :
  #   - clôture de session (Q3, Q10, Q12) — trou principal
  #   - choix de l'étudiant sans mot de passe (Q1)
  #   - affectation d'un relecteur (Q7)
  #   - remplacement du lien (Q13)
  #   - consultation des notes sans nom de relecteur (Q8)
  # Toutes sont sous /api, figées avant le premier commit de code.
  # ===========================================================================

  /api/promotions:
    get:
      summary: Liste des promotions (écran formateur)
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }

  /api/promotions/{id}/etudiants:
    get:
      summary: Liste des étudiants d'une promotion — Q1, choix sans mot de passe
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/sessions/{id}:
    get:
      summary: Détail d'une session — code, statut, expiration (RG1) et clôture (RG16)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                required:
                  [id, titre, promotionId, code, statut, ouvertureAt, expirationAt, clotureAt]
                properties:
                  id: { type: integer, format: int64 }
                  titre: { type: string }
                  promotionId: { type: integer, format: int64 }
                  code: { type: string }
                  statut: { type: string, enum: [OUVERTE, CLOTUREE] }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
                  clotureAt: { type: string, format: date-time, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/sessions/{id}/cloturer:
    post:
      summary: Le formateur clôture la session — comble le trou principal (Q3, Q10, Q12 / RG11, RG16)
      description: |
        Opération ajoutée : aucun texte du sujet ni du contrat imposé ne décrit
        la clôture, alors que Q3, Q10 et Q12 en dépendent. Après clôture :
          - POST /api/exercices répond 409 (RG11)
          - les relectures rendues sont figées (RG9)
        Distinct de l'expiration du code (`expirationAt`, RG1 / Q2).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema:
                type: object
                required: [id, statut, clotureAt]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [OUVERTE, CLOTUREE] }
                  clotureAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/relectures:
    post:
      summary: Création / affectation d'une relecture — Q7
      description: |
        Le POST imposé sur /api/relectures/{id} REND une relecture existante ;
        il faut donc une opération qui la CRÉE, au dépôt de l'exercice.
        Relecteur tiré au hasard parmi les étudiants présents à la session,
        auteur exclu (RG6). Si aucun pair éligible : `relecteurId` null et
        statut EN_ATTENTE, visible dans le tableau (Q11 / RG10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exerciceId]
              properties:
                exerciceId: { type: integer, format: int64 }
      responses:
        "201":
          description: Relecture créée et affectée
          content:
            application/json:
              schema:
                type: object
                required: [id, exerciceId, relecteurId, statut]
                properties:
                  id: { type: integer, format: int64 }
                  exerciceId: { type: integer, format: int64 }
                  relecteurId:
                    type: integer
                    format: int64
                    nullable: true
                  statut: { type: string, enum: [EN_ATTENTE, RENDUE] }
        "400": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_CREE

    get:
      summary: Mes relectures (écran relecteur)
      parameters:
        - name: relecteurId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: statut
          in: query
          required: false
          schema: { type: string, enum: [EN_ATTENTE, RENDUE] }
      responses:
        "200":
          description: Relectures du relecteur
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, exerciceId, relecteurId, statut, lien]
                  properties:
                    id: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    relecteurId: { type: integer, format: int64 }
                    statut: { type: string, enum: [EN_ATTENTE, RENDUE] }
                    lien: { type: string, format: uri }
                    note: { type: integer, nullable: true }
                    commentaire: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

  /api/exercices/{id}/relectures:
    get:
      summary: Notes et commentaires reçus sur mon exercice — Q8 / RG7
      description: Le nom du relecteur n'est JAMAIS renvoyé (RG7).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures de l'exercice, sans identité du relecteur
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, statut, note, commentaire]
                  properties:
                    id: { type: integer, format: int64 }
                    statut: { type: string, enum: [EN_ATTENTE, RENDUE] }
                    note:
                      type: integer
                      minimum: 0
                      maximum: 20
                      nullable: true
                    commentaire: { type: string, nullable: true }
                    rendueLe: { type: string, format: date-time, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU

  /api/exercices/{id}/lien:
    put:
      summary: Remplacement du lien d'exercice — Q13 / RG12
      description: |
        Autorisé tant que la relecture est EN_ATTENTE ; dès qu'une note est
        rendue, réponse 409 (RG12). Après clôture de la session, 409 (RG11).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut, misAJourLe]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
                  misAJourLe: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_COMMENCEE ou SESSION_TERMINEE

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
