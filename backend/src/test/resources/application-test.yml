spring:
  datasource:
    # Poste vierge : la base de test est en mémoire, en mode PostgreSQL (B6).
    url: jdbc:h2:mem:tests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate      # le schéma vient de V1/V2, jamais des entités (B5)
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
