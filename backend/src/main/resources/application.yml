spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kfokam48}
    username: ${SPRING_DATASOURCE_USERNAME:kfokam48}
    password: ${SPRING_DATASOURCE_PASSWORD:kfokam48}
  jpa:
    hibernate:
      ddl-auto: validate          # B5 : le schéma naît de Flyway, jamais des entités
    open-in-view: false           # B3 : les DTO sont construits dans la couche service
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

logging:
  level:
    epreuve.kfokam48.backend: INFO
